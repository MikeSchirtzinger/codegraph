# Ground truth manifest for tests/fixtures/c-cpp.
# Schema documented in ../README.md — read that first.
fixture: c-cpp
language: c-cpp
root: tests/fixtures/c-cpp
description: >
  Minimal, deliberately flat (no subdirectories) C/C++ project mixing C++
  (namespaces, main.cpp/alpha/beta/db/even/odd) and plain C (legacy.c,
  linked via extern "C"). gamma.cpp uses using-directives to bring two
  same-named `helper`s into unqualified scope (case c, D3) — valid to write,
  ambiguous only at the point of actual use, same shape as the Rust/Go
  fixtures' glob/dot-import cases. legacy.c is the cleanest place in this
  suite to demonstrate R5 (project-unique bare name): C has no
  namespace/module syntax at all, so a bare call never needs same-file scope
  or an import to be valid in the first place.

# Ground truth for qualified_name computation (R0's accept criterion).
# Convention: file-basename-inclusive, like Rust/Python/TypeScript (NOT
# Go/Java's directory-only rule) — C/C++ has no language- or tooling-level
# convention tying namespaces to directories, so the file path is the only
# mechanical signal available. This fixture's files are deliberately named
# to match their namespace (db.cpp <-> `namespace db`, etc.) so the
# file-basename segment and the namespace happen to coincide, because the
# current c_cpp.rs extractor does not yet track namespace containment at
# all (no `namespace_definition` handling — see "Contract interpretations"
# in ../README.md for the follow-up this implies).
nodes:
  - {file: main.cpp, name: log_startup, node_type: function, qualified_name: "main::log_startup"}
  - {file: main.cpp, name: run, node_type: function, qualified_name: "main::run"}
  - {file: main.cpp, name: main, node_type: function, qualified_name: "main::main"}
  - {file: gamma.cpp, name: dispatch, node_type: function, qualified_name: "gamma::dispatch"}
  - {file: alpha.cpp, name: helper, node_type: function, qualified_name: "alpha::helper"}
  - {file: beta.cpp, name: helper, node_type: function, qualified_name: "beta::helper"}
  - {file: db.cpp, name: connect, node_type: function, qualified_name: "db::connect"}
  - {file: even.cpp, name: is_even, node_type: function, qualified_name: "even::is_even"}
  - {file: odd.cpp, name: is_odd, node_type: function, qualified_name: "odd::is_odd"}
  - {file: legacy.c, name: legacy_helper, node_type: function, qualified_name: "legacy::legacy_helper"}

# Ground truth for the resolver cascade (R1's accept criterion). Field
# semantics documented once in ../README.md.
edges:
  - case: a
    defect: D1
    edge_type: calls
    from: "main::run"
    from_file: main.cpp
    to_name: log_startup
    to_type: function
    confidence: RESOLVED
    resolved_by: r3
    target: "main::log_startup"
    candidates: null

  - case: b
    defect: D2
    edge_type: calls
    from: "main::run"
    from_file: main.cpp
    to_name: "db::connect"
    to_type: function
    confidence: RESOLVED
    resolved_by: r1
    target: "db::connect"
    candidates: null

  - case: e
    defect: null
    edge_type: calls
    from: "main::run"
    from_file: main.cpp
    to_name: "std::getenv"
    to_type: function
    confidence: UNRESOLVED
    resolved_by: r6
    target: null
    candidates: []

  - case: c
    defect: D3
    edge_type: calls
    from: "gamma::dispatch"
    from_file: gamma.cpp
    to_name: helper
    to_type: function
    confidence: AMBIGUOUS
    resolved_by: r6
    target: null
    candidates: ["alpha::helper", "beta::helper"]

  - case: d-cycle-even
    defect: D4
    edge_type: calls
    from: "even::is_even"
    from_file: even.cpp
    to_name: "odd::is_odd"
    to_type: function
    confidence: RESOLVED
    resolved_by: r1
    target: "odd::is_odd"
    candidates: null

  - case: d-cycle-odd
    defect: D4
    edge_type: calls
    from: "odd::is_odd"
    from_file: odd.cpp
    to_name: "even::is_even"
    to_type: function
    confidence: RESOLVED
    resolved_by: r1
    target: "even::is_even"
    candidates: null

  - case: bonus-r5
    defect: null
    edge_type: calls
    from: "main::main"
    from_file: main.cpp
    to_name: legacy_helper
    to_type: function
    confidence: RESOLVED
    resolved_by: r5
    target: "legacy::legacy_helper"
    candidates: null
    note: >
      Bare C call from a DIFFERENT file (main.cpp), no #include-based
      qualification possible even in principle (C has no namespaces) --
      unique project-wide, so R5 is the first (and, for C, essentially
      only-possible) rule that resolves it. Deliberately cross-file: a
      same-file bare call to legacy_helper would resolve via R3 instead and
      not demonstrate R5 at all (an earlier draft of this fixture made
      exactly that mistake — legacy_run calling legacy_helper within the
      same legacy.c file — caught by hand cross-checking this manifest
      against the cascade before finalizing; legacy_run was removed and the
      call now happens directly from main()).

# Derived file_ref cross-file cycles (D4's fix).
cycles:
  - files: [even.cpp, odd.cpp]
    via: calls
